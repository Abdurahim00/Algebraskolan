name: algebra
description: A new Flutter project.
publish_to: 'none'

version: 2.0.0+19

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (aligned majors)
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.1
  firebase_remote_config: ^6.0.0

  # Auth / sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # UI / utils
  provider: ^6.1.2
  google_fonts: ^6.3.0
  font_awesome_flutter: ^10.9.0
  auto_size_text: ^3.0.0
  unicons: ^3.0.0
  lottie: ^3.3.1
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  animated_splash_screen: ^1.3.0
  page_transition: ^2.2.1
  fluttertoast: ^8.2.12
  connectivity_plus: ^6.1.4
  audioplayers: ^6.5.0
  cached_network_image: ^3.4.1
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  
  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  mocktail: ^1.0.3
  build_runner: ^2.6.1
  fake_cloud_firestore: ^4.0.0
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
        - asset: assets/fonts/Roboto-Thin.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
    - family: Pangolin
      fonts:
        - asset: assets/fonts/Pangolin-Regular.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf
        - asset: assets/fonts/DancingScript-Bold.ttf

flutter_native_splash:
  image: assets/images/favicon.png
  android: true
  ios: true
  web: false
