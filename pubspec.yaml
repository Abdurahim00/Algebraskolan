name: algebra
description: A new Flutter project.
publish_to: 'none'

version: 1.1.7+12

environment:
  sdk: '>=3.0.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.1.4
  google_sign_in: ^6.1.4
  firebase_core: ^3.3.0
  font_awesome_flutter: ^10.4.0
  provider: ^6.0.5
  auto_size_text: ^3.0.0
  unicons: any
  google_fonts: ^6.1.0
  lottie: ^3.1.2
  intl: ^0.18.0
  shared_preferences: ^2.1.1
  animated_splash_screen: ^1.3.0
  page_transition: ^2.0.9
  fluttertoast: ^8.2.6
  connectivity_plus: ^6.0.4
  audioplayers: ^6.0.0
  cached_network_image: ^3.3.3
  sign_in_with_apple: ^6.1.1
  firebase_remote_config: ^5.0.4










dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.0.0
  build_runner: ^2.0.0


  mocktail: ^1.0.1

  fake_cloud_firestore: ^3.0.2
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
        - asset: assets/fonts/Roboto-Thin.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
    - family: Pangolin
      fonts:
        - asset: assets/fonts/Pangolin-Regular.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf
        - asset: assets/fonts/DancingScript-Bold.ttf

flutter_native_splash:
  image: assets/images/favicon.png  # Use your desired image path
  android: true
  ios: true
  web: false



